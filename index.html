<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f4c3a">
<title>איילה · מעקב שעות</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --green:#0f4c3a;
    --green-soft:#1a6b51;
    --gold:#d9a441;
    --gold-soft:#f0d9a8;
    --cream:#f7f4ec;
    --ink:#1d211f;
    --muted:#6f7a74;
    --line:#e3ddd0;
    --card:#ffffff;
    --danger:#b5462f;
    --ok:#2f7d52;
    --shadow:0 2px 14px rgba(15,76,58,.10);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Heebo","Segoe UI",system-ui,-apple-system,sans-serif;
    background:var(--cream);
    color:var(--ink);
    font-size:16px;
    line-height:1.5;
    padding-bottom:90px;
  }
  /* ---------- header ---------- */
  header{
    position:sticky;top:0;z-index:40;
    background:linear-gradient(135deg,var(--green),var(--green-soft));
    color:#fff;
    padding:14px 16px;
    display:flex;align-items:center;justify-content:space-between;
    box-shadow:0 2px 12px rgba(0,0,0,.15);
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .mark{
    width:38px;height:38px;border-radius:12px;
    background:var(--gold);
    display:grid;place-items:center;
    font-weight:800;color:var(--green);font-size:20px;
    box-shadow:inset 0 -2px 4px rgba(0,0,0,.15);
  }
  .brand h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.3px;}
  .brand small{display:block;font-size:11px;opacity:.85;font-weight:400;}
  .menu-btn{
    background:rgba(255,255,255,.15);border:none;color:#fff;
    width:42px;height:42px;border-radius:12px;font-size:22px;
    cursor:pointer;display:grid;place-items:center;
  }
  .menu-btn:active{background:rgba(255,255,255,.28);}
  /* ---------- dropdown ---------- */
  .dropdown{
    position:absolute;top:64px;left:12px;z-index:50;
    background:#fff;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.22);
    overflow:hidden;min-width:200px;display:none;
  }
  .dropdown.open{display:block;}
  .dropdown button{
    display:flex;align-items:center;gap:10px;width:100%;text-align:right;
    background:none;border:none;padding:13px 16px;font-size:15px;cursor:pointer;
    color:var(--ink);border-bottom:1px solid var(--line);font-family:inherit;
  }
  .dropdown button:last-child{border-bottom:none;}
  .dropdown button:active{background:var(--cream);}
  .dropdown button .ic{font-size:18px;}
  /* ---------- tabs ---------- */
  .tabs{
    display:flex;background:#fff;border-bottom:1px solid var(--line);
    position:sticky;top:66px;z-index:30;
  }
  .tabs button{
    flex:1;background:none;border:none;padding:13px 4px;font-size:14px;
    font-weight:600;color:var(--muted);cursor:pointer;font-family:inherit;
    border-bottom:3px solid transparent;
  }
  .tabs button.active{color:var(--green);border-bottom-color:var(--gold);}
  /* ---------- layout ---------- */
  main{padding:14px;max-width:760px;margin:0 auto;}
  .card{
    background:var(--card);border-radius:16px;padding:16px;
    box-shadow:var(--shadow);margin-bottom:14px;border:1px solid var(--line);
  }
  .card h2{margin:0 0 12px;font-size:16px;color:var(--green);display:flex;align-items:center;gap:8px;}
  label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:600;}
  input,select{
    width:100%;padding:12px;border:1.5px solid var(--line);border-radius:11px;
    font-size:16px;font-family:inherit;background:#fff;color:var(--ink);
  }
  input:focus,select:focus{outline:none;border-color:var(--gold);}
  .note-field{
    width:100%;padding:11px;border:1.5px solid var(--line);border-radius:11px;
    font-size:15px;font-family:inherit;background:#fff;color:var(--ink);resize:vertical;
  }
  .note-field:focus{outline:none;border-color:var(--gold);}
  .place-row{border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:9px;background:#fff;}
  .place-row-top{display:flex;justify-content:space-between;align-items:center;}
  .place-rate-line{display:flex;align-items:center;gap:10px;margin-top:8px;}
  .place-rate-line label{flex:none;color:var(--muted);}
  .place-rate-input{flex:1;max-width:120px;padding:9px;border:1.5px solid var(--line);border-radius:9px;font-size:15px;font-family:inherit;}
  .place-rate-input:focus{outline:none;border-color:var(--gold);}
  .row{display:flex;gap:10px;margin-bottom:12px;}
  .row>div{flex:1;}
  .dow{
    background:var(--gold-soft);color:#7a5b16;border-radius:11px;
    padding:12px;text-align:center;font-weight:700;font-size:15px;
  }
  .calc-pill{
    background:var(--green);color:#fff;border-radius:11px;padding:12px;
    text-align:center;font-weight:700;font-size:15px;
  }
  .btn{
    width:100%;padding:14px;border:none;border-radius:12px;font-size:16px;
    font-weight:700;cursor:pointer;font-family:inherit;
  }
  .btn-primary{background:var(--gold);color:var(--green);}
  .btn-primary:active{background:#c8922f;}
  .btn-ghost{background:var(--cream);color:var(--green);border:1.5px solid var(--line);}
  /* ---------- filters ---------- */
  .filters{display:flex;gap:8px;margin-bottom:12px;}
  .filters select{font-size:14px;padding:10px;}
  /* ---------- entry rows ---------- */
  .entry{
    background:#fff;border:1px solid var(--line);border-radius:14px;
    padding:12px;margin-bottom:10px;box-shadow:var(--shadow);
  }
  .entry-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .entry-date{font-weight:700;font-size:15px;color:var(--green);}
  .entry-date span{font-weight:400;color:var(--muted);font-size:12.5px;margin-right:4px;}
  .entry-place{
    display:inline-block;background:var(--gold-soft);color:#7a5b16;
    font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;margin-top:5px;
  }
  .entry-meta{display:flex;gap:14px;margin-top:9px;flex-wrap:wrap;}
  .entry-meta div{font-size:13px;}
  .entry-meta b{color:var(--green);}
  .day-income{
    margin-top:10px;background:linear-gradient(135deg,var(--gold-soft),#fff);
    border:1px solid var(--gold);border-radius:11px;padding:9px 12px;
    font-size:14px;font-weight:600;color:#7a5b16;display:flex;
    justify-content:space-between;align-items:center;
  }
  .day-income b{font-size:17px;color:var(--green);}
  .entry-actions{display:flex;gap:6px;}
  .icon-btn{
    width:36px;height:36px;border-radius:10px;border:none;cursor:pointer;
    display:grid;place-items:center;font-size:16px;
  }
  .icon-edit{background:#eaf3ee;}
  .icon-del{background:#fbeae6;}
  .empty{text-align:center;color:var(--muted);padding:40px 16px;font-size:14px;}
  .empty .big{font-size:42px;display:block;margin-bottom:8px;}
  /* ---------- monthly summary ---------- */
  .month-block{margin-bottom:14px;}
  .month-head{
    display:flex;justify-content:space-between;align-items:center;
    background:var(--green);color:#fff;padding:13px 15px;border-radius:14px 14px 0 0;
    font-weight:700;font-size:15px;
  }
  .month-body{
    background:#fff;border:1px solid var(--line);border-top:none;
    border-radius:0 0 14px 14px;padding:14px;
  }
  .stat{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px;}
  .stat:last-of-type{border-bottom:none;}
  .stat b{color:var(--green);}
  .gap-row{margin-top:10px;padding-top:10px;border-top:2px solid var(--line);}
  .bank-input{display:flex;gap:8px;align-items:center;margin-top:10px;}
  .bank-input input{flex:1;}
  .badge{font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;}
  .badge-open{background:#fbeae6;color:var(--danger);}
  .badge-fixed{background:#e7f4ec;color:var(--ok);}
  .badge-zero{background:#eef0ee;color:var(--muted);}
  .fix-row{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;}
  .fix-row input[type=checkbox]{width:20px;height:20px;flex:none;accent-color:var(--green);}
  .check-note{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.4;}
  .total-strip{
    background:linear-gradient(135deg,var(--gold-soft),#fff);
    border:1px solid var(--gold);border-radius:14px;padding:14px;
    display:flex;justify-content:space-around;text-align:center;margin-bottom:14px;
  }
  .total-strip div span{display:block;font-size:12px;color:var(--muted);}
  .total-strip div b{font-size:20px;color:var(--green);}
  /* ---------- modal ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(20,30,26,.55);z-index:60;
    display:none;align-items:flex-end;justify-content:center;
  }
  .overlay.open{display:flex;}
  .sheet{
    background:var(--cream);width:100%;max-width:760px;border-radius:20px 20px 0 0;
    padding:18px 16px 26px;max-height:90vh;overflow:auto;animation:up .25s ease;
  }
  @keyframes up{from{transform:translateY(40px);opacity:.5;}to{transform:none;opacity:1;}}
  .sheet h3{margin:0 0 14px;color:var(--green);font-size:18px;}
  .sheet-actions{display:flex;gap:10px;margin-top:8px;}
  .sheet-actions .btn{flex:1;}
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--green);color:#fff;padding:12px 22px;border-radius:30px;
    font-size:14px;font-weight:600;z-index:80;opacity:0;transition:.3s;
    box-shadow:0 6px 20px rgba(0,0,0,.3);pointer-events:none;
  }
  .toast.show{opacity:1;bottom:34px;}
  .settings-note{font-size:12.5px;color:var(--muted);margin-top:6px;}
  .rate-display{
    background:var(--green);color:#fff;border-radius:11px;padding:10px 14px;
    display:flex;justify-content:space-between;align-items:center;font-size:14px;
  }
  .rate-display b{font-size:18px;}
  hr.soft{border:none;border-top:1px solid var(--line);margin:14px 0;}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="mark">א</div>
    <div>
      <h1>איילה</h1>
      <small>מעקב שעות עבודה</small>
    </div>
  </div>
  <button class="menu-btn" id="menuBtn">⋮</button>
  <div class="dropdown" id="dropdown">
    <button id="excelBtn"><span class="ic">📊</span> ייצוא לאקסל</button>
    <button id="backupBtn"><span class="ic">⬇️</span> גיבוי נתונים</button>
    <button id="restoreBtn"><span class="ic">⬆️</span> שחזור / טעינה</button>
    <button id="autoBtn"><span class="ic">🔄</span> גיבוי אוטומטי שבועי</button>
    <button id="settingsBtn"><span class="ic">⚙️</span> מקומות ותעריפים</button>
  </div>
</header>

<div class="tabs">
  <button class="active" data-tab="entry">הזנה</button>
  <button data-tab="log">רישומים</button>
  <button data-tab="summary">סיכום חודשי</button>
</div>

<main>
  <!-- ============ ENTRY TAB ============ -->
  <section id="tab-entry">
    <div class="card">
      <h2>🕒 רישום משמרת</h2>
      <div class="row">
        <div>
          <label>תאריך</label>
          <input type="date" id="inDate">
        </div>
        <div>
          <label>יום בשבוע</label>
          <div class="dow" id="dowOut">—</div>
        </div>
      </div>
      <div class="row">
        <div>
          <label>שעת התחלה</label>
          <input type="time" id="inStart">
        </div>
        <div>
          <label>שעת סיום</label>
          <input type="time" id="inEnd">
        </div>
      </div>
      <div class="row">
        <div>
          <label>מקום עבודה</label>
          <div style="display:flex;gap:8px">
            <select id="inPlace" style="flex:1"></select>
            <button type="button" id="managePlacesBtn" class="icon-btn icon-edit" style="width:46px;flex:none" title="ניהול מקומות">＋</button>
          </div>
        </div>
        <div>
          <label>סך שעות</label>
          <div class="calc-pill" id="hoursOut">0.00</div>
        </div>
      </div>
      <button class="btn btn-primary" id="addBtn">הוסף רישום</button>
    </div>
  </section>

  <!-- ============ LOG TAB ============ -->
  <section id="tab-log" style="display:none">
    <div class="filters">
      <select id="filterPlace"><option value="">כל מקומות העבודה</option></select>
      <select id="filterMonth"><option value="">כל החודשים</option></select>
    </div>
    <div id="logList"></div>
  </section>

  <!-- ============ SUMMARY TAB ============ -->
  <section id="tab-summary" style="display:none">
    <div class="filters">
      <select id="summaryMonth"><option value="">כל החודשים (סך הכל)</option></select>
    </div>
    <div class="total-strip">
      <div><span>סך שעות</span><b id="tHours">0</b></div>
      <div><span>סך זכאות</span><b id="tDue">₪0</b></div>
      <div><span>פערים פתוחים</span><b id="tOpen">0</b></div>
    </div>
    <div id="summaryList"></div>
  </section>
</main>

<!-- entry edit sheet -->
<div class="overlay" id="editOverlay">
  <div class="sheet">
    <h3>עריכת רישום</h3>
    <input type="hidden" id="editId">
    <div class="row">
      <div><label>תאריך</label><input type="date" id="eDate"></div>
      <div><label>יום בשבוע</label><div class="dow" id="eDow">—</div></div>
    </div>
    <div class="row">
      <div><label>התחלה</label><input type="time" id="eStart"></div>
      <div><label>סיום</label><input type="time" id="eEnd"></div>
    </div>
    <label>מקום עבודה</label>
    <select id="ePlace" style="margin-bottom:12px"></select>
    <div class="sheet-actions">
      <button class="btn btn-ghost" id="eCancel">ביטול</button>
      <button class="btn btn-primary" id="eSave">שמור</button>
    </div>
  </div>
</div>

<!-- manage places sheet -->
<div class="overlay" id="placesOverlay">
  <div class="sheet">
    <h3>ניהול מקומות ותעריפים</h3>
    <div class="row" style="margin-bottom:8px">
      <div style="flex:2"><label>שם מקום חדש</label><input type="text" id="newPlaceInput" placeholder="לדוגמה: חוג התעמלות"></div>
      <div style="flex:1"><label>תעריף לשעה</label><input type="number" inputmode="decimal" id="newPlaceRate" placeholder="₪"></div>
    </div>
    <button class="btn btn-primary" id="addPlaceBtn">הוסף מקום</button>
    <div class="check-note" style="margin-top:8px">שינוי תעריף משפיע רק על רישומים חדשים מכאן והלאה. רישומים קיימים לא משתנים.</div>
    <div id="placesList" style="margin-top:14px"></div>
    <div class="sheet-actions" style="margin-top:14px">
      <button class="btn btn-ghost" id="placesClose">סגור</button>
    </div>
  </div>
</div>

<input type="file" id="restoreFile" accept=".json" style="display:none">
<div class="toast" id="toast"></div>

<script>
const DAYS=["יום ראשון","יום שני","יום שלישי","יום רביעי","יום חמישי","יום שישי","יום שבת"];
const MONTHS=["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];
const KEY="ayala_data_v1";

let state=load();
function load(){
  try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);return migrate(d);}}catch(e){}
  return {rate:0,entries:[],banks:{},fixed:{},places:["תמר","אמירים","עופרים"],placeRates:{},autoBackup:false,lastAutoBackup:null,notes:{}};
}
// upgrade older data to per-place rates without losing anything
function migrate(d){
  if(!d.places||!d.places.length)d.places=["תמר","אמירים","עופרים"];
  if(!d.notes)d.notes={};
  if(typeof d.rate!=="number")d.rate=0;
  if(!d.placeRates){
    d.placeRates={};
    // seed every existing place with the old single rate
    d.places.forEach(p=>{d.placeRates[p]=d.rate||0;});
  }
  // snapshot a rate onto any entry that doesn't have one yet
  (d.entries||[]).forEach(e=>{
    if(e.rate===undefined||e.rate===null){
      e.rate=(d.placeRates[e.place]!==undefined)?d.placeRates[e.place]:(d.rate||0);
    }
  });
  return d;
}
// current rate for a place (falls back to default rate)
function placeRate(p){
  if(state.placeRates&&state.placeRates[p]!==undefined)return Number(state.placeRates[p])||0;
  return Number(state.rate)||0;
}
function save(){localStorage.setItem(KEY,JSON.stringify(state));}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

/* ---------- helpers ---------- */
function dow(dateStr){if(!dateStr)return"—";const d=new Date(dateStr+"T00:00");return DAYS[d.getDay()];}
function calcHours(s,e){
  if(!s||!e)return 0;
  let[sh,sm]=s.split(":").map(Number),[eh,em]=e.split(":").map(Number);
  let mins=(eh*60+em)-(sh*60+sm);
  if(mins<0)mins+=1440; // crosses midnight
  return mins/60;
}
function monthKey(dateStr){return dateStr.slice(0,7);} // YYYY-MM
function monthLabel(mk){const[y,m]=mk.split("-");return MONTHS[+m-1]+" "+y;}
function fmtMoney(n){return"₪"+(Math.round(n*100)/100).toLocaleString("he-IL");}
function fmtH(n){return(Math.round(n*100)/100).toFixed(2);}

/* ---------- entry tab ---------- */
const inDate=document.getElementById("inDate"),inStart=document.getElementById("inStart"),
      inEnd=document.getElementById("inEnd"),inPlace=document.getElementById("inPlace"),
      dowOut=document.getElementById("dowOut"),hoursOut=document.getElementById("hoursOut");

function todayStr(){
  const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());
  return d.toISOString().slice(0,10);
}
inDate.value=todayStr();
inDate.max=todayStr();
function refreshEntryCalc(){
  dowOut.textContent=dow(inDate.value);
  hoursOut.textContent=fmtH(calcHours(inStart.value,inEnd.value));
}
[inDate,inStart,inEnd].forEach(el=>el.addEventListener("input",refreshEntryCalc));
refreshEntryCalc();

// shared validation for date: blocks future, warns on Saturday
function dateOk(dateStr){
  if(dateStr>todayStr()){toast("לא ניתן לרשום תאריך עתידי");return false;}
  const d=new Date(dateStr+"T00:00");
  if(d.getDay()===6){ // Saturday
    return confirm("בחרת יום שבת. האם בטוח שעבדת ביום זה?");
  }
  return true;
}

document.getElementById("addBtn").onclick=()=>{
  if(!inDate.value){toast("יש לבחור תאריך");return;}
  if(!dateOk(inDate.value))return;
  if(!inStart.value||!inEnd.value){toast("יש להזין שעות התחלה וסיום");return;}
  if(!inPlace.value){toast("יש לבחור מקום עבודה");return;}
  state.entries.push({
    id:uid(),date:inDate.value,start:inStart.value,end:inEnd.value,
    place:inPlace.value,hours:calcHours(inStart.value,inEnd.value),
    rate:placeRate(inPlace.value)
  });
  save();
  inStart.value="";inEnd.value="";
  refreshEntryCalc();renderAll();
  toast("הרישום נוסף ✓");
};

/* ---------- log tab ---------- */
function uniquePlaces(){return[...new Set(state.entries.map(e=>e.place))].sort();}
function uniqueMonths(){return[...new Set(state.entries.map(e=>monthKey(e.date)))].sort().reverse();}

function refreshFilters(){
  const fp=document.getElementById("filterPlace"),fm=document.getElementById("filterMonth");
  const pv=fp.value,mv=fm.value;
  fp.innerHTML='<option value="">כל מקומות העבודה</option>'+state.places.map(p=>`<option ${p===pv?"selected":""}>${esc(p)}</option>`).join("");
  fm.innerHTML='<option value="">כל החודשים</option>'+uniqueMonths().map(m=>`<option value="${m}" ${m===mv?"selected":""}>${monthLabel(m)}</option>`).join("");
  // entry + edit selects
  fillPlaceSelect(document.getElementById("inPlace"));
  fillPlaceSelect(document.getElementById("ePlace"));
}
function fillPlaceSelect(sel){
  if(!sel)return;
  const cur=sel.value;
  sel.innerHTML=state.places.map(p=>`<option ${p===cur?"selected":""}>${esc(p)}</option>`).join("");
}
document.getElementById("filterPlace").onchange=renderLog;
document.getElementById("filterMonth").onchange=renderLog;
document.getElementById("summaryMonth").onchange=renderSummary;

function renderLog(){
  const fp=document.getElementById("filterPlace").value;
  const fm=document.getElementById("filterMonth").value;
  let list=state.entries.filter(e=>(!fp||e.place===fp)&&(!fm||monthKey(e.date)===fm));
  list.sort((a,b)=>b.date.localeCompare(a.date)||b.start.localeCompare(a.start));
  const box=document.getElementById("logList");
  if(!list.length){box.innerHTML=`<div class="empty"><span class="big">📋</span>אין רישומים להצגה</div>`;return;}
  box.innerHTML=list.map(e=>`
    <div class="entry">
      <div class="entry-top">
        <div>
          <div class="entry-date">${fmtDate(e.date)}<span>${dow(e.date)}</span></div>
          <div class="entry-place">📍 ${esc(e.place)}</div>
        </div>
        <div class="entry-actions">
          <button class="icon-btn icon-edit" onclick="openEdit('${e.id}')">✏️</button>
          <button class="icon-btn icon-del" onclick="delEntry('${e.id}')">🗑️</button>
        </div>
      </div>
      <div class="entry-meta">
        <div>⏰ <b>${e.start}–${e.end}</b></div>
        <div>סך שעות: <b>${fmtH(e.hours)}</b></div>
        ${e.rate>0?`<div>תעריף: <b>${fmtMoney(e.rate)}</b> לשעה</div>`:""}
      </div>
      ${e.rate>0
        ? `<div class="day-income">💰 הכנסה ליום עבודה <b>${fmtMoney(e.hours*e.rate)}</b></div>`
        : `<div class="check-note" style="margin-top:8px">למקום זה לא הוגדר תעריף. הגדר דרך ⋮ ← ניהול מקומות ותעריפים.</div>`}
    </div>`).join("");
}
function fmtDate(d){const[y,m,dd]=d.split("-");return`${dd}/${m}/${y}`;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

window.delEntry=function(id){
  if(!confirm("למחוק את הרישום?"))return;
  state.entries=state.entries.filter(e=>e.id!==id);
  save();renderAll();toast("נמחק");
};

/* ---------- edit ---------- */
const editOverlay=document.getElementById("editOverlay");
window.openEdit=function(id){
  const e=state.entries.find(x=>x.id===id);if(!e)return;
  document.getElementById("editId").value=id;
  eDate.value=e.date;eStart.value=e.start;eEnd.value=e.end;
  eDate.max=todayStr();
  // ensure the entry's place exists in the select even if removed from list
  let opts=state.places.slice();
  if(!opts.includes(e.place))opts.push(e.place);
  ePlace.innerHTML=opts.map(p=>`<option ${p===e.place?"selected":""}>${esc(p)}</option>`).join("");
  ePlace.value=e.place;
  eDow.textContent=dow(e.date);
  editOverlay.classList.add("open");
};
const eDate=document.getElementById("eDate"),eStart=document.getElementById("eStart"),
      eEnd=document.getElementById("eEnd"),ePlace=document.getElementById("ePlace"),
      eDow=document.getElementById("eDow");
eDate.addEventListener("input",()=>eDow.textContent=dow(eDate.value));
document.getElementById("eCancel").onclick=()=>editOverlay.classList.remove("open");
document.getElementById("eSave").onclick=()=>{
  const id=document.getElementById("editId").value;
  const e=state.entries.find(x=>x.id===id);if(!e)return;
  if(!eDate.value||!eStart.value||!eEnd.value||!ePlace.value){toast("יש למלא את כל השדות");return;}
  if(!dateOk(eDate.value))return;
  const placeChanged=e.place!==ePlace.value;
  e.date=eDate.value;e.start=eStart.value;e.end=eEnd.value;
  e.place=ePlace.value;e.hours=calcHours(eStart.value,eEnd.value);
  if(placeChanged)e.rate=placeRate(ePlace.value); // match new place's current rate
  if(e.rate===undefined)e.rate=placeRate(e.place);
  save();editOverlay.classList.remove("open");renderAll();toast("עודכן ✓");
};

// per-place breakdown inside a month (shown when >1 place that month)
function placeBreakdown(ents){
  const byPlace={};
  ents.forEach(e=>{
    if(!byPlace[e.place])byPlace[e.place]={hours:0,due:0,rate:e.rate||0};
    byPlace[e.place].hours+=e.hours;
    byPlace[e.place].due+=e.hours*(e.rate||0);
  });
  const names=Object.keys(byPlace);
  if(names.length<=1)return"";
  return `<div style="margin:4px 0 2px;padding:8px 10px;background:var(--cream);border-radius:10px">
    ${names.map(p=>{
      const b=byPlace[p];
      return `<div class="stat" style="font-size:13px"><span>📍 ${esc(p)} · ${fmtH(b.hours)} ש' × ${fmtMoney(b.rate)}</span><b>${fmtMoney(b.due)}</b></div>`;
    }).join("")}
  </div>`;
}

/* ---------- summary tab ---------- */
function renderSummary(){
  const box=document.getElementById("summaryList");
  const allMonths=uniqueMonths();
  // populate month filter
  const sm=document.getElementById("summaryMonth");
  const smv=sm.value;
  sm.innerHTML='<option value="">כל החודשים (סך הכל)</option>'+allMonths.map(m=>`<option value="${m}" ${m===smv?"selected":""}>${monthLabel(m)}</option>`).join("");
  const sel=sm.value;
  const months=sel?allMonths.filter(m=>m===sel):allMonths;

  // totals reflect current filter
  let totalH=0,totalDue=0;
  const scope=state.entries.filter(e=>!sel||monthKey(e.date)===sel);
  scope.forEach(e=>{totalH+=e.hours;totalDue+=e.hours*(e.rate||0);});
  document.getElementById("tHours").textContent=fmtH(totalH);
  document.getElementById("tDue").textContent=fmtMoney(totalDue);

  if(!months.length){box.innerHTML=`<div class="empty"><span class="big">📊</span>אין נתונים לסיכום</div>`;
    document.getElementById("tOpen").textContent="0";return;}

  // open gaps counted globally across all months
  let open=0;
  allMonths.forEach(mk=>{
    const ents=state.entries.filter(e=>monthKey(e.date)===mk);
    const dueM=ents.reduce((s,e)=>s+e.hours*(e.rate||0),0);
    const b=state.banks[mk];
    if(b!==undefined&&b!==""){const g=dueM-Number(b);if(g>0.009&&!state.fixed[mk])open++;}
  });
  document.getElementById("tOpen").textContent=open;

  box.innerHTML=months.map(mk=>{
    const ents=state.entries.filter(e=>monthKey(e.date)===mk);
    const hours=ents.reduce((s,e)=>s+e.hours,0);
    const due=ents.reduce((s,e)=>s+e.hours*(e.rate||0),0);
    const bank=state.banks[mk];
    const hasBank=bank!==undefined&&bank!=="";
    const gap=hasBank?(due-Number(bank)):null;
    const fixed=!!state.fixed[mk];

    let gapHtml="";
    if(hasBank){
      let badge,fixHtml="";
      if(Math.abs(gap)<0.01){
        badge=`<span class="badge badge-zero">אין פער</span>`;
      }else if(gap>0){
        badge=fixed
          ?`<span class="badge badge-fixed">טופל / תוקן ✓</span>`
          :`<span class="badge badge-open">פער פתוח · חסר ${fmtMoney(gap)}</span>`;
        fixHtml=`
          <div class="fix-row">
            <input type="checkbox" id="fx_${mk}" ${fixed?"checked":""} onchange="toggleFixed('${mk}',this.checked)">
            <label for="fx_${mk}" style="margin:0;color:var(--ink);font-weight:600">סמן כטופל / תוקן</label>
          </div>
          <div class="check-note">הבדיקה מתבצעת חודש לאחר מכן. סמן כאן רק לאחר שהפער הושלם בפועל.</div>
          <div style="margin-top:10px">
            <label>הערה להסבר הפער (לא חובה)</label>
            <textarea class="note-field" rows="2" placeholder="לדוגמה: ההשלמה תתקבל בחודש הבא" onchange="setNote('${mk}',this.value)">${esc(state.notes&&state.notes[mk]?state.notes[mk]:"")}</textarea>
          </div>`;
      }else{
        badge=`<span class="badge badge-fixed">עודף ${fmtMoney(-gap)}</span>`;
      }
      gapHtml=`
        <div class="gap-row">
          <div class="stat"><span>התקבל בבנק</span><b>${fmtMoney(Number(bank))}</b></div>
          <div class="stat"><span>פער</span>${badge}</div>
          ${fixHtml}
        </div>`;
    }

    return `
    <div class="month-block">
      <div class="month-head">
        <span>📅 ${monthLabel(mk)}</span>
        <span>${ents.length} משמרות</span>
      </div>
      <div class="month-body">
        <div class="stat"><span>סך שעות</span><b>${fmtH(hours)}</b></div>
        ${due>0?`<div class="stat"><span>סך זכאות</span><b>${fmtMoney(due)}</b></div>`:`<div class="check-note">למקומות בחודש זה לא הוגדר תעריף. הגדר דרך ⋮ ← ניהול מקומות ותעריפים.</div>`}
        ${placeBreakdown(ents)}
        <div class="bank-input">
          <input type="number" inputmode="decimal" placeholder="כמה התקבל בבנק (₪)" value="${hasBank?bank:""}" data-old="${hasBank?bank:""}" onchange="setBank('${mk}',this)">
        </div>
        ${gapHtml}
      </div>
    </div>`;
  }).join("");
  document.getElementById("tOpen").textContent=open;
}
window.setBank=function(mk,el){
  const val=el.value;
  const old=el.dataset.old;
  const hadValue=old!==undefined&&old!=="";
  // confirm only when changing a value that was already entered
  if(hadValue&&val!==old){
    if(!confirm(`זה הסכום שהתקבל בגין ${monthLabel(mk)}: ${fmtMoney(Number(old))}.\nהאם בטוח שרוצה לשנות נתון זה?`)){
      el.value=old; // revert
      return;
    }
  }
  if(val==="")delete state.banks[mk];else state.banks[mk]=val;
  save();renderSummary();
};
window.toggleFixed=function(mk,checked){
  if(checked)state.fixed[mk]=true;else delete state.fixed[mk];
  save();renderSummary();
};
window.setNote=function(mk,val){
  if(!state.notes)state.notes={};
  if(val.trim()==="")delete state.notes[mk];else state.notes[mk]=val.trim();
  save(); // no re-render: keep typing flow smooth
};

/* ---------- render orchestration ---------- */
function renderAll(){refreshFilters();renderLog();renderSummary();}
renderAll();

/* ---------- tabs ---------- */
document.querySelectorAll(".tabs button").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    ["entry","log","summary"].forEach(t=>document.getElementById("tab-"+t).style.display="none");
    document.getElementById("tab-"+b.dataset.tab).style.display="block";
  };
});

/* ---------- menu ---------- */
const dd=document.getElementById("dropdown");
document.getElementById("menuBtn").onclick=e=>{e.stopPropagation();dd.classList.toggle("open");};
document.addEventListener("click",()=>dd.classList.remove("open"));

/* download helper */
function downloadBlob(blob,name){
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function backupName(){return"ayala גיבוי "+todayStr()+".json";}

/* manual JSON backup */
function doBackup(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  downloadBlob(blob,backupName());
}
document.getElementById("backupBtn").onclick=()=>{doBackup();toast("הגיבוי הורד ✓");};

/* Excel export */
document.getElementById("excelBtn").onclick=()=>{
  if(typeof XLSX==="undefined"){toast("ייצוא אקסל דורש חיבור לאינטרנט");return;}
  if(!state.entries.length){toast("אין נתונים לייצוא");return;}
  exportExcel();
};
function exportExcel(){
  // sheet 1 — all entries (rate per entry)
  const rows=state.entries.slice().sort((a,b)=>a.date.localeCompare(b.date)||a.start.localeCompare(b.start))
    .map(e=>({
      "תאריך":fmtDate(e.date),
      "יום בשבוע":dow(e.date),
      "מקום עבודה":e.place,
      "התחלה":e.start,
      "סיום":e.end,
      "סך שעות":Math.round(e.hours*100)/100,
      "תעריף לשעה":e.rate||0,
      "הכנסה ליום":Math.round(e.hours*(e.rate||0)*100)/100
    }));
  // sheet 2 — monthly summary
  const months=uniqueMonths().slice().reverse();
  const sum=months.map(mk=>{
    const ents=state.entries.filter(e=>monthKey(e.date)===mk);
    const h=ents.reduce((s,e)=>s+e.hours,0);
    const due=ents.reduce((s,e)=>s+e.hours*(e.rate||0),0);
    const bank=state.banks[mk];
    const hasBank=bank!==undefined&&bank!=="";
    const gap=hasBank?(due-Number(bank)):"";
    let status="—";
    if(hasBank){
      if(Math.abs(due-Number(bank))<0.01)status="אין פער";
      else if(due-Number(bank)>0)status=state.fixed[mk]?"טופל / תוקן":"פער פתוח";
      else status="עודף";
    }
    return{
      "חודש":monthLabel(mk),
      "מספר משמרות":ents.length,
      "סך שעות":Math.round(h*100)/100,
      "זכאות":Math.round(due*100)/100,
      "התקבל בבנק":hasBank?Number(bank):"",
      "פער":gap===""?"":Math.round(gap*100)/100,
      "סטטוס":status,
      "הערה":(state.notes&&state.notes[mk])?state.notes[mk]:""
    };
  });
  const wb=XLSX.utils.book_new();
  const ws1=XLSX.utils.json_to_sheet(rows);
  const ws2=XLSX.utils.json_to_sheet(sum);
  ws1["!cols"]=[{wch:12},{wch:11},{wch:12},{wch:8},{wch:8},{wch:9},{wch:11},{wch:11}];
  ws2["!cols"]=[{wch:14},{wch:12},{wch:9},{wch:10},{wch:12},{wch:10},{wch:12},{wch:28}];
  XLSX.utils.book_append_sheet(wb,ws1,"רישומים");
  XLSX.utils.book_append_sheet(wb,ws2,"סיכום חודשי");
  XLSX.writeFile(wb,"ayala שעות "+todayStr()+".xlsx");
  toast("קובץ האקסל הורד ✓");
}

/* weekly auto-backup */
function checkAutoBackup(){
  if(!state.autoBackup)return;
  const last=state.lastAutoBackup?new Date(state.lastAutoBackup):null;
  const now=new Date();
  if(!last||(now-last)>=7*24*60*60*1000){
    if(state.entries.length){
      doBackup();
      state.lastAutoBackup=now.toISOString();save();
      toast("בוצע גיבוי אוטומטי שבועי ✓");
    }
  }
}
document.getElementById("autoBtn").onclick=()=>{
  state.autoBackup=!state.autoBackup;
  if(state.autoBackup&&!state.lastAutoBackup)state.lastAutoBackup=new Date().toISOString();
  save();updateAutoLabel();
  toast(state.autoBackup?"גיבוי אוטומטי שבועי הופעל ✓":"גיבוי אוטומטי כבוי");
};
function updateAutoLabel(){
  const b=document.getElementById("autoBtn");
  b.innerHTML=`<span class="ic">🔄</span> גיבוי אוטומטי שבועי ${state.autoBackup?"✓":""}`;
}
updateAutoLabel();
/* restore */
document.getElementById("restoreBtn").onclick=()=>document.getElementById("restoreFile").click();
document.getElementById("restoreFile").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d.entries||!Array.isArray(d.entries))throw 0;
      if(!confirm("השחזור יחליף את כל הנתונים הקיימים. להמשיך?"))return;
      state=migrate({rate:d.rate||0,entries:d.entries,banks:d.banks||{},fixed:d.fixed||{},places:(d.places&&d.places.length)?d.places:["תמר","אמירים","עופרים"],placeRates:d.placeRates,autoBackup:!!d.autoBackup,lastAutoBackup:d.lastAutoBackup||null,notes:d.notes||{}});
      save();renderAll();refreshEntryCalc();updateAutoLabel();toast("הנתונים שוחזרו ✓");
    }catch(err){toast("קובץ לא תקין");}
  };
  r.readAsText(f);e.target.value="";
};

/* manage places */
const placesOverlay=document.getElementById("placesOverlay");
document.getElementById("managePlacesBtn").onclick=()=>{renderPlacesList();placesOverlay.classList.add("open");};
document.getElementById("placesClose").onclick=()=>{placesOverlay.classList.remove("open");refreshFilters();};
document.getElementById("addPlaceBtn").onclick=()=>{
  const v=document.getElementById("newPlaceInput").value.trim();
  const rv=document.getElementById("newPlaceRate").value;
  if(!v){toast("יש להזין שם מקום");return;}
  if(state.places.includes(v)){toast("המקום כבר קיים");return;}
  state.places.push(v);
  if(!state.placeRates)state.placeRates={};
  state.placeRates[v]=Number(rv)||0;
  save();
  document.getElementById("newPlaceInput").value="";
  document.getElementById("newPlaceRate").value="";
  renderPlacesList();refreshFilters();toast("המקום נוסף ✓");
};
document.getElementById("newPlaceRate").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("addPlaceBtn").click();});
function renderPlacesList(){
  const box=document.getElementById("placesList");
  if(!state.places.length){box.innerHTML=`<div class="check-note">אין מקומות. הוסף מקום ראשון למעלה.</div>`;return;}
  box.innerHTML=state.places.map((p,i)=>`
    <div class="place-row">
      <div class="place-row-top">
        <span style="font-weight:600;color:var(--ink)">📍 ${esc(p)}</span>
        <button class="icon-btn icon-del" onclick="removePlace(${i})">🗑️</button>
      </div>
      <div class="place-rate-line">
        <label style="margin:0">תעריף לשעה (₪)</label>
        <input type="number" inputmode="decimal" class="place-rate-input" value="${state.placeRates&&state.placeRates[p]!==undefined?state.placeRates[p]:0}" onchange="setPlaceRate(${i},this.value)">
      </div>
    </div>`).join("");
}
window.setPlaceRate=function(i,val){
  const p=state.places[i];if(p===undefined)return;
  if(!state.placeRates)state.placeRates={};
  state.placeRates[p]=Number(val)||0;
  save();renderLog();renderSummary();
  toast("התעריף עודכן · חל על רישומים חדשים בלבד");
};
window.removePlace=function(i){
  const p=state.places[i];
  const used=state.entries.some(e=>e.place===p);
  if(used){if(!confirm(`קיימים רישומים עם "${p}". המקום יוסר מהרשימה אך הרישומים הקיימים יישארו. להמשיך?`))return;}
  state.places.splice(i,1);
  if(state.placeRates)delete state.placeRates[p];
  save();renderPlacesList();refreshFilters();toast("המקום הוסר");
};

/* settings menu item -> opens the places & rates sheet */
document.getElementById("settingsBtn").onclick=()=>{renderPlacesList();placesOverlay.classList.add("open");};

/* toast */
let toastT;
function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;t.classList.add("show");
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2200);
}

/* run weekly auto-backup check after load */
setTimeout(checkAutoBackup,1500);
</script>
